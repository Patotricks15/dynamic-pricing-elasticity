[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dp-elasticity"
version = "0.1.0"
description = "Log-log price elasticity from online retail transactions, with confidence intervals."
requires-python = ">=3.12"
dependencies = [
    "pandas==2.3.3",
    "numpy==2.2.6",
    "statsmodels==0.14.4",
    "scipy==1.15.3",
    "matplotlib==3.10.3",
    "seaborn==0.13.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.1",
    "jupytext==1.17.2",
    "nbconvert==7.16.6",
    "ipykernel==6.29.5",
    "nbformat==5.10.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
